<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Tracker By Eaurah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ╔═══════════════════════════════════════════════════════════════════╗
   ║   ✧ la feuille de style ✧  sobre dehors, tendre dedans ♡           ║
   ╚═══════════════════════════════════════════════════════════════════╝
   - noir / blanc / gris ; vert et rouge désaturés, juste assez pour dire
     "bon" ou "mauvais" d'un coup d'œil~
   - une seule barre, en bas. rien ne flotte en haut, ça respire ♡
   - on ne bouge QUE ce qui a changé : pas de voile gris, pas de spinner.
     une page qui sautille pendant qu'on lit un pseudo, c'est insupportable
   ===================================================================== */

:root {
  --bg:     #0b0b0c;
  --panel:  #101011;
  --panel2: #141416;
  --raise:  #1a1a1d;
  --line:   #202023;
  --line2:  #2c2c31;
  --text:   #ececee;
  --dim:    #96969c;
  --dim2:   #62626a;
  --dim3:   #43434a;
  --good:   #7fbe9b;
  --bad:    #d38b91;
  --warn:   #c7b184;
  --mono:   'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
  --bar:    2.9rem;
  --r:      10px;
  --gut:    1rem;
  --t:      150ms cubic-bezier(.4, 0, .2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); font-size: 16px; }
/* la taille de l'interface ♡ réglable dans Réglages, et déjà resserrée
   d'office sur les largeurs tablette où tout avait l'air zoomé~ */
html[data-scale="xs"] { font-size: 12.5px; }
html[data-scale="s"]  { font-size: 14px; }
html[data-scale="m"]  { font-size: 16px; }
html[data-scale="l"]  { font-size: 17.5px; }
@media (max-width: 1400px) { html:not([data-scale]) { font-size: 15px; } }
@media (max-width: 1100px) { html:not([data-scale]) { font-size: 14px; } }
@media (max-width: 820px)  { html:not([data-scale]) { font-size: 13.5px; } }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
  font-size: .875rem; line-height: 1.45; min-height: 100vh;
  padding-bottom: calc(var(--bar) + env(safe-area-inset-bottom));
  -webkit-font-smoothing: antialiased;
}
::selection { background: #fff; color: #000; }
img { display: block; }
button, select, input, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

* { scrollbar-width: thin; scrollbar-color: #2c2c31 transparent; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-thumb { background: #29292d; border-radius: 6px; border: 2px solid var(--bg); }
*::-webkit-scrollbar-track { background: transparent; }

@keyframes rowIn { from { opacity: 0; transform: translateY(-4px) } to { opacity: 1; transform: none } }
@keyframes flash { 0% { background: rgba(255,255,255,.16) } 100% { background: transparent } }
@keyframes sweep { 0% { left: -30% } 100% { left: 100% } }
@keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
@keyframes sh { to { background-position: -300% 0 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }

.wrap { max-width: 1560px; margin: 0 auto; padding: var(--gut) var(--gut) 26px; }

/* ✿ les titres ✿ */
.hd {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  margin: 24px 0 9px; font-size: .72rem; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
}
.hd:first-child { margin-top: 0; }
.hd .cnt { color: var(--dim2); font-weight: 500; letter-spacing: .04em; font-family: var(--mono); }
.hd .right {
  margin-left: auto; font-weight: 500; letter-spacing: .01em;
  text-transform: none; font-size: .74rem; color: var(--dim2); font-family: var(--mono);
}
.hd .right b { color: var(--text); font-weight: 500; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.pill {
  display: inline-block; font-size: .67rem; font-weight: 600; letter-spacing: .03em;
  color: var(--dim); background: var(--raise); border: 1px solid var(--line2);
  border-radius: 5px; padding: 0 6px; vertical-align: 1px;
}
.empty {
  text-align: center; color: var(--dim2); font-size: .84rem; line-height: 1.75;
  padding: 52px 20px; border: 1px dashed var(--line2); border-radius: var(--r);
}
.empty .big { display: block; font-size: 1.6rem; margin-bottom: 10px; opacity: .45; }
.skel {
  height: 56px; border-radius: var(--r); margin-bottom: 8px;
  background: linear-gradient(90deg, var(--panel) 25%, var(--panel2) 50%, var(--panel) 75%);
  background-size: 300% 100%; animation: sh 1.5s linear infinite;
}

/* ✿ les équipes, côte à côte ✿ */
.teams { display: grid; gap: 14px; align-items: start; }
@media (min-width: 940px) { .teams.two { grid-template-columns: 1fr 1fr; } }

.team { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); overflow: hidden; }
.teamHead {
  display: flex; align-items: baseline; gap: 9px;
  padding: 10px 14px 9px; border-bottom: 1px solid var(--line); background: var(--panel2);
}
.teamHead h2 { font-size: .72rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.team[data-side="ally"]  .teamHead h2 { color: var(--good); }
.team[data-side="enemy"] .teamHead h2 { color: var(--bad); }
.teamHead .cnt { color: var(--dim2); font-size: .7rem; font-family: var(--mono); }
.teamHead .avg { margin-left: auto; font-size: .7rem; color: var(--dim2); font-family: var(--mono); }
.teamHead .avg b { color: var(--dim); font-weight: 500; }

.gridRow {
  display: grid;
  grid-template-columns: 2rem minmax(0, 1fr) 6.2rem repeat(4, 2.7rem) 3.1rem;
  align-items: center; gap: 0 .62rem;
}
.colHead {
  padding: 6px 14px 7px; border-bottom: 1px solid var(--line);
  font-size: .58rem; font-weight: 600; letter-spacing: .13em;
  text-transform: uppercase; color: var(--dim3);
}
.colHead span { text-align: right; }
.colHead span.l { text-align: left; }

.plWrap { border-bottom: 1px solid var(--line); }
.plWrap:last-child { border-bottom: 0; }
.plWrap.fresh > .pl { animation: rowIn 160ms ease-out; }

.pl { position: relative; padding: .5rem .88rem; cursor: pointer; transition: background var(--t); }
.pl:hover { background: var(--panel2); }
.plWrap.open > .pl { background: var(--panel2); }
.pl.me::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--text); }

.pAgent { position: relative; width: 2rem; height: 2rem; }
.pAgent img, .pAgent .ph { width: 2rem; height: 2rem; border-radius: 7px; background: var(--raise); object-fit: cover; }
.pAgent .ph { display: grid; place-items: center; color: var(--dim3); font-size: .78rem; }
.pAgent .lock { position: absolute; right: -2px; bottom: -2px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--panel); }
.pAgent .lock.locked { background: var(--good); }
.pAgent .lock.picking { background: var(--warn); }

.pWho { min-width: 0; }
.pName { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: .86rem; font-weight: 600; }
.pName .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pName .n.masked { color: var(--dim); font-style: italic; }
.pName .tag { color: var(--dim3); font-weight: 400; font-size: .74rem; font-family: var(--mono); flex: none; }
.pName .flag { width: 15px; height: 11px; border-radius: 2px; object-fit: cover; flex: none; }
.pName .flag.guess { opacity: .4; }
.pName .party { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.pName .mini {
  font-size: .56rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--dim2); border: 1px solid var(--line2); border-radius: 4px; padding: 0 4px; flex: none;
}
.pSub { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: .7rem; color: var(--dim2); margin-top: 1px; }
.pSub .sep { opacity: .35; }

.pRank { display: flex; align-items: center; gap: 7px; min-width: 0; }
.pRank img { width: 1.32rem; height: 1.32rem; flex: none; }
.pRank .rn { font-size: .73rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pRank .rr { font-size: .64rem; color: var(--dim2); font-family: var(--mono); }
.pRank .rr .up { color: var(--good); } .pRank .rr .down { color: var(--bad); }
.pRank .rr .lb { color: var(--warn); font-weight: 600; }

.pNum { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .81rem; }
.pNum.dim { color: var(--dim3); }
.pNum.good { color: var(--good); }
.pNum.bad { color: var(--bad); }
.pNum.chg { animation: flash 700ms ease-out; border-radius: 4px; }

.pForm { display: flex; gap: 3px; justify-content: flex-end; }
.pForm i { width: 6px; height: 13px; border-radius: 2px; background: #2a2a2e; }
.pForm i.W { background: var(--text); }
.pForm i.L { background: #3c3c42; }

/* 2e ligne : les jolis skins équipés (en partie seulement) + étiquettes ♡ */
.pExtra { grid-column: 2 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 5px; min-width: 0; }
.skins { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.sk { position: relative; display: flex; align-items: center; height: 20px; padding-left: 7px; border-left: 2px solid var(--line2); }
.sk img { height: .95rem; width: auto; max-width: 5rem; object-fit: contain; opacity: .92; }
.sk .nm { display: none; font-size: .66rem; color: var(--dim); margin-left: 6px; white-space: nowrap; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
.plWrap.open .sk .nm, .wide .sk .nm { display: inline; }
@media (min-width: 820px) and (max-width: 939px) { .sk .nm { display: inline; } }
.chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: .68rem; }
.chip {
  border: 1px solid var(--line2); border-radius: 5px; padding: 0 6px;
  color: var(--dim); background: var(--raise);
  max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chip.smurf { color: var(--warn); border-color: #383024; }
.chip.note { color: var(--text); }

.plStats { grid-area: stats; display: none; gap: 12px; align-items: center; margin-top: 3px; font-size: .71rem; color: var(--dim2); font-family: var(--mono); }
.plStats b { font-weight: 600; color: var(--text); }
.plStats b.good { color: var(--good); } .plStats b.bad { color: var(--bad); }

/* Détail dépliable, à sa place dans la liste */
.plDetail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 180ms cubic-bezier(.4,0,.2,1); }
.plWrap.open .plDetail { grid-template-rows: 1fr; }
.plDetail > .in { overflow: hidden; }
.plDetail .pad { padding: 0 14px; border-top: 1px solid var(--line); background: #0d0d0e; }
.plWrap.open .plDetail .pad { padding: 14px 14px 18px; }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.kpis .k { background: var(--panel); padding: 9px 11px; }
.kpis .k b { display: block; font-family: var(--mono); font-size: 1rem; font-weight: 600; }
.kpis .k b.good { color: var(--good); } .kpis .k b.bad { color: var(--bad); }
.kpis .k span { font-size: .6rem; letter-spacing: .12em; text-transform: uppercase; color: var(--dim3); }
.kpis .k b .pForm { justify-content: flex-start; padding: 3px 0 2px; }
@media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, 1fr); } }

.sub { font-size: .64rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--dim3); margin: 16px 0 7px; }
.lockerGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); gap: 7px; }
.skinCell { background: var(--panel); border: 1px solid var(--line); border-top-width: 2px; border-radius: 8px; padding: 9px 8px; text-align: center; }
.skinCell img { width: 100%; height: 26px; object-fit: contain; margin-bottom: 6px; }
.skinCell .w { display: block; font-size: .57rem; letter-spacing: .1em; text-transform: uppercase; color: var(--dim3); }
.skinCell .s { display: block; font-size: .71rem; font-weight: 600; line-height: 1.25; }
.skinCell .x { display: block; font-size: .61rem; color: var(--dim2); margin-top: 2px; }

.agentsRow { display: flex; gap: 7px; flex-wrap: wrap; }
.agentPill { display: flex; align-items: center; gap: 7px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px 4px 4px; font-size: .73rem; }
.agentPill img { width: 22px; height: 22px; border-radius: 5px; }
.agentPill small { color: var(--dim3); font-family: var(--mono); font-size: .64rem; }

.btnRow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.btn { background: var(--raise); border: 1px solid var(--line2); border-radius: 7px; padding: 5px 11px; font-size: .75rem; cursor: pointer; text-decoration: none; color: var(--text); transition: border-color var(--t); }
.btn:hover { border-color: #3d3d44; }
.btn.primary { background: var(--text); color: #0b0b0c; border-color: var(--text); font-weight: 600; }
select.sel { background: var(--raise); border: 1px solid var(--line2); border-radius: 7px; padding: 5px 8px; font-size: .75rem; outline: none; cursor: pointer; max-width: 190px; }
.noteBox { width: 100%; min-height: 62px; resize: vertical; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: .79rem; outline: none; font-family: inherit; }
.noteBox:focus { border-color: var(--line2); }
.saved { color: var(--good); font-size: .71rem; opacity: 0; transition: opacity var(--t); }
.saved.on { opacity: 1; }

/* petits écrans : la grille se replie */
@media (max-width: 700px) {
  .colHead { display: none; }
  .teamHead { flex-wrap: wrap; }
  .teamHead .avg { width: 100%; margin-left: 0; margin-top: 2px; }
  .gridRow {
    grid-template-columns: 32px minmax(0, 1fr) auto;
    grid-template-areas: "agent who rank" "agent stats stats" "agent extra extra";
    gap: 2px 10px;
  }
  .gridRow > .pAgent { grid-area: agent; align-self: start; }
  .gridRow > .pWho { grid-area: who; }
  .gridRow > .pRank { grid-area: rank; justify-self: end; }
  .gridRow > .pNum, .gridRow > .pForm { display: none; }
  .gridRow > .plStats { display: flex; }
  .gridRow > .pExtra { grid-area: extra; }
}

.dense .pl { padding: 5px 14px; }
.dense .pExtra, .dense .pSub { display: none; }

/* ✿ les listes ✿ */
.row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row.noic { grid-template-columns: 1fr auto; }
.row.click { cursor: pointer; transition: background var(--t); }
.row.click:hover { background: var(--panel2); }
.row .ic { width: 28px; height: 28px; border-radius: 6px; background: var(--raise); object-fit: cover; }
.row .t1 { font-size: .81rem; font-weight: 600; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.row .t2 { font-size: .69rem; color: var(--dim2); margin-top: 1px; }
.row .rt { text-align: right; font-family: var(--mono); font-size: .8rem; font-weight: 600; }
.row .rt small { display: block; font-size: .64rem; color: var(--dim3); font-weight: 400; margin-top: 1px; }
.row.win { box-shadow: inset 2px 0 0 var(--good); }
.row.loss { box-shadow: inset 2px 0 0 var(--bad); }
.row.draw { box-shadow: inset 2px 0 0 var(--line2); }

.searchBar { margin-bottom: 12px; }
.searchBar input { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: .83rem; outline: none; transition: border-color var(--t); }
.searchBar input::placeholder { color: var(--dim3); }
.searchBar input:focus { border-color: var(--line2); }

.spark { width: 100%; max-width: 800px; height: auto; display: block; margin: 0 auto; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 9px; }
.shopCell { background: var(--panel); border: 1px solid var(--line); border-top: 2px solid var(--line2); border-radius: 8px; padding: 11px 9px; text-align: center; }
.shopCell img { width: 100%; height: 42px; object-fit: contain; margin-bottom: 7px; }
.shopCell .n { display: block; font-size: .73rem; font-weight: 600; line-height: 1.3; }
.shopCell .c { display: block; font-family: var(--mono); font-size: .71rem; color: var(--dim); margin-top: 3px; }
.shopCell .c s { color: var(--dim3); }
.walletRow { display: flex; gap: 9px; flex-wrap: wrap; }
.walletRow .w { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px; font-family: var(--mono); font-size: .92rem; font-weight: 600; }
.walletRow .w small { display: block; font-family: 'Inter', sans-serif; font-size: .58rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--dim3); }

.setRow { display: flex; align-items: center; gap: 14px; padding: 11px 14px; border-bottom: 1px solid var(--line); font-size: .81rem; }
.setRow:last-child { border-bottom: 0; }
.setRow small { display: block; color: var(--dim3); font-size: .68rem; margin-top: 1px; }
.setRow > :last-child { margin-left: auto; }
.sw { width: 34px; height: 19px; border-radius: 19px; background: var(--raise); border: 1px solid var(--line2); position: relative; cursor: pointer; flex: none; transition: background var(--t), border-color var(--t); }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--dim); transition: transform var(--t), background var(--t); }
.sw.on { background: var(--text); border-color: var(--text); }
.sw.on::after { transform: translateX(15px); background: #0b0b0c; }

/* ✿ la barre du bas, gentille pour le pouce ✿ */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  height: calc(var(--bar) + env(safe-area-inset-bottom));
  padding: 0 var(--gut) env(safe-area-inset-bottom);
  display: flex; align-items: center; gap: 14px;
  background: rgba(13,13,14,.92); backdrop-filter: blur(18px);
  border-top: 1px solid var(--line);
}
.bar::before {
  content: ''; position: absolute; top: -1px; left: -30%; width: 30%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--text), transparent);
  opacity: 0; pointer-events: none;
}
.bar.busy::before { opacity: .9; animation: sweep 900ms cubic-bezier(.4,0,.2,1) infinite; }

.barState {
  display: flex; align-items: center; gap: 11px; min-width: 0;
  cursor: pointer; height: 100%; padding-right: 4px;
  font-size: .77rem; color: var(--dim); user-select: none;
}
.barState:hover .st, .barState:hover .hint { color: var(--text); }
.barState .st { color: var(--text); font-weight: 600; letter-spacing: .03em; white-space: nowrap; transition: color var(--t); }
.barState .st.live::before {
  content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%;
  background: #fff; margin-right: 7px; vertical-align: 2px; animation: blink 1.8s ease-in-out infinite;
}
.barState .ctx { color: var(--dim2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barState .sc { font-family: var(--mono); font-size: .82rem; font-weight: 600; color: var(--text); white-space: nowrap; }
.barState .sc i { font-style: normal; color: var(--dim3); margin: 0 2px; }
.barState .hint { color: var(--dim3); font-size: .68rem; white-space: nowrap; transition: color var(--t); }
@media (max-width: 900px) { .barState .hint { display: none; } }
@media (max-width: 560px) { .barState .ctx { display: none; } }

.barTabs { margin-left: auto; display: flex; gap: 2px; padding: 3px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; }
.barTabs button {
  background: none; border: 0; cursor: pointer; color: var(--dim2);
  font-size: .72rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
  padding: 4px 12px; border-radius: 6px; transition: color var(--t), background var(--t);
}
.barTabs button:hover { color: var(--text); }
.barTabs button.on { background: var(--text); color: #0b0b0c; }
.conn { width: 6px; height: 6px; border-radius: 50%; background: var(--dim3); flex: none; transition: background var(--t); }
.conn.on { background: var(--good); } .conn.poll { background: var(--warn); } .conn.off { background: var(--bad); }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--bar) + 16px + env(safe-area-inset-bottom));
  transform: translate(-50%, 8px);
  background: var(--raise); border: 1px solid var(--line2); border-radius: 8px;
  padding: 8px 14px; font-size: .77rem; z-index: 90;
  opacity: 0; pointer-events: none; transition: opacity var(--t), transform var(--t);
  max-width: calc(100% - 28px);
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
footer { text-align: center; color: #37373d; font-size: .65rem; padding: 30px 10px 0; letter-spacing: .05em; }
</style>
</head>
<body>

<div class="wrap">
  <main id="live"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>

  <main id="me" hidden>
    <div id="meStats"></div>
    <div id="meStore"></div>
    <div id="meSet"></div>
  </main>

  <main id="journal" hidden></main>

  <footer>Dev by eaurah (G_F_)</footer>
</div>

<div class="bar" id="bar">
  <div class="barState" id="barState" title="Cliquer = rafraîchir complètement (relit la session Riot)">
    <span class="st" id="state">Chargement…</span>
    <span class="ctx" id="ctx"></span>
    <span class="sc" id="score" hidden></span>
    <span class="hint">clic = rafraîchir</span>
  </div>
  <nav class="barTabs" id="tabs">
    <button data-v="live" class="on">Partie</button>
    <button data-v="me">Moi</button>
    <button data-v="journal">Journal</button>
  </nav>
  <span class="conn" id="conn" title="Connexion"></span>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* ╭──────────────────────────────────────────────────────────╮
   │  les petits outils ♡
   │  rien de méchant ici, promis~
   ╰──────────────────────────────────────────────────────────╯ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const num = (v, d = '—') => (v == null || v === '' ? d : v);
const sleep = ms => new Promise(r => setTimeout(r, ms));

const S = { dense: false, showSmurf: true, sort: 'rank', wideSkins: false, scale: '' };
try { Object.assign(S, JSON.parse(localStorage.getItem('tbe') || '{}')); } catch (e) {}
const saveS = () => { try { localStorage.setItem('tbe', JSON.stringify(S)); } catch (e) {} };
/* taille de l'interface : '' = on décide tout seul selon l'écran ♡ */
function applyScale() {
  if (S.scale) document.documentElement.dataset.scale = S.scale;
  else document.documentElement.removeAttribute('data-scale');
}
applyScale();

let toastT;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400);
}

const kdClass  = v => v == null ? '' : v >= 1.15 ? 'good' : v <= .85 ? 'bad' : '';
const acsClass = v => v == null ? '' : v >= 240  ? 'good' : v <= 160 ? 'bad' : '';
const hsClass  = v => v == null ? '' : v >= 24   ? 'good' : v <= 13  ? 'bad' : '';
const wrClass  = v => v == null ? '' : v >= 55   ? 'good' : v <= 40  ? 'bad' : '';

function dt(ms) {
  const d = new Date(ms);
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' ' +
         d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}
const mmss = sec => sec == null ? '' : Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
function dur(sec) {
  if (sec == null) return '';
  if (sec >= 86400) return Math.floor(sec / 86400) + 'j ' + Math.floor((sec % 86400) / 3600) + 'h';
  if (sec >= 3600)  return Math.floor(sec / 3600) + 'h ' + Math.floor((sec % 3600) / 60) + 'm';
  return mmss(sec);
}

/* ╭──────────────────────────────────────────────────────────╮
   │  les onglets ♡
   │  trois vues, une seule barre en bas
   ╰──────────────────────────────────────────────────────────╯ */
const VIEWS = ['live', 'me', 'journal'];
let view = 'live';
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]');
  if (!b) return;
  view = b.dataset.v;
  [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b));
  VIEWS.forEach(v => { $(v).hidden = v !== view; });
  window.scrollTo({ top: 0 });
  if (view === 'me') loadMe();
  if (view === 'journal') loadJournal();
});

/* ╭──────────────────────────────────────────────────────────╮
   │  la vue partie ♡
   │  le cœur du tracker, celle qu'on regarde
   ╰──────────────────────────────────────────────────────────╯ */
const live = $('live');
const elState = $('state'), elCtx = $('ctx'), elScore = $('score'), elConn = $('conn');
let firstLoad = true, lastPuuids = new Set(), lastVersion = -1, lastData = null,
    shellKey = '', hasPlayers = false;

const SRC_TXT = { manual: 'drapeau que tu as défini', tag: 'déduit du tag Riot', script: 'déduit de l’alphabet du pseudo' };

function flagImg(c) {
  if (!c || !c.code) return '';
  return `<img class="flag ${c.source === 'manual' ? '' : 'guess'}" loading="lazy"
    src="https://flagcdn.com/w40/${esc(c.code)}.png" alt="${esc(c.code.toUpperCase())}"
    title="${esc(c.name)} — ${esc(SRC_TXT[c.source] || c.source)}">`;
}
function trackerUrl(p) {
  if (!p || !p.name || !p.tag) return '';
  return 'https://tracker.gg/valorant/profile/riot/' + encodeURIComponent(p.name + '#' + p.tag) + '/overview';
}
function formBars(form) {
  if (!form || !form.length) return '';
  return form.slice(0, 6).map(f => `<i class="${f === 'W' ? 'W' : f === 'L' ? 'L' : ''}"></i>`).join('');
}
const formHtml = form => formBars(form) ? `<div class="pForm" title="Forme récente (récent → ancien)">${formBars(form)}</div>` : '';

function seenShort(s) {
  const b = [];
  if (s.ts) b.push(new Date(s.ts * 1000).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }));
  if (s.map) b.push(esc(s.map));
  if (s.count > 1) b.push(s.count + '×');
  return b.join(' · ');
}
function seenLong(s) {
  let t = s.ts ? 'le ' + new Date(s.ts * 1000).toLocaleDateString('fr-FR') + ' à ' +
    new Date(s.ts * 1000).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
  t += ' · ' + (s.map || '?') + ' · ' + (s.queue || '?');
  if (s.agent) t += ' · il jouait ' + s.agent;
  if (s.myAgent) t += ', toi ' + s.myAgent;
  if (s.count > 1) t += ' · ' + s.count + ' fois (' + (s.asAlly || 0) + ' avec / ' + (s.asEnemy || 0) + ' contre)';
  return t;
}

/* ✿ les skins équipés, visibles direct dans la liste ✿
   Uniquement en partie : `hasLocker` n'est vrai qu'en INGAME (au lobby et
   en sélection d'agents Riot renvoie des loadouts faux).
   Deux sources : le champ `skins` du serveur s'il est là, sinon on va le
   chercher soi-même sur /api/locker (déjà en cache côté serveur). Comme ça
   la bande s'affiche même si le serveur tourne encore une version plus
   ancienne — aucun clic nécessaire dans les deux cas. */
const WEAPON_RANK = {
  vandal: 1, phantom: 2, operator: 3, sheriff: 4, ghost: 5, spectre: 6,
  classic: 7, guardian: 8, marshal: 9, outlaw: 9, bulldog: 10, judge: 11, odin: 12,
};
const lockerCache = {};
const isMelee = w => /couteau|m[eê]l[eé]e|melee|dague/i.test(w || '');
const isPlain = sk => !sk || /^(standard|par d[ée]faut)/i.test(sk);

function showcaseFromLocker(locker) {
  return (locker || [])
    .filter(it => !isPlain(it.skin))
    .map(it => ({ ...it, _r: isMelee(it.weapon) ? 25 : (WEAPON_RANK[String(it.weapon).toLowerCase()] || 40) }))
    .sort((a, b) => a._r - b._r)
    .slice(0, 6);
}

function skinChip(k) {
  const tip = `${k.weapon} — ${k.skin}${k.variant ? ' · ' + k.variant : ''}${k.tier ? ' · ' + k.tier : ''}`;
  return `<span class="sk" title="${esc(tip)}" style="border-left-color:${esc(k.tierColor || 'var(--line2)')}">` +
    (k.icon ? `<img src="${esc(k.icon)}" alt="" loading="lazy">` : '') +
    `<span class="nm"${k.icon ? '' : ' style="display:inline;margin-left:0"'}>${esc(k.skin)}</span></span>`;
}

/* on va chercher soi-même les skins que le serveur n'a pas envoyés ♡ */
async function fetchMissingSkins(box) {
  const holes = [...box.querySelectorAll('.skins[data-lk]:empty')];
  for (const el of holes) {
    const pu = el.dataset.lk;
    if (lockerCache[pu]) { el.innerHTML = lockerCache[pu].map(skinChip).join(''); continue; }
    if (el._busy) continue;
    el._busy = true;
    try {
      const r = await (await fetch('/api/locker/' + encodeURIComponent(pu))).json();
      const list = showcaseFromLocker(r && r.locker);
      lockerCache[pu] = list;
      if (el.isConnected) el.innerHTML = list.map(skinChip).join('');
    } catch (e) { /* on retentera au prochain rafraîchissement */ }
    el._busy = false;
  }
}

function skinStrip(p) {
  const list = p.skins || (lockerCache[p.puuid] || null);
  if (list && list.length) return `<div class="skins">` + list.map(skinChip).join('') + `</div>`;
  if (list) return '';                       // déjà cherché : ce joueur n'a que du standard
  if (!p.hasLocker) return '';               // pas en partie : rien de fiable à montrer
  return `<div class="skins" data-lk="${esc(p.puuid)}"></div>`;
}

function cell(val, cls, key) {
  const vide = val === '·' || val == null;
  return `<div class="pNum ${vide ? 'dim' : (cls || '')}" data-k="${key}">${esc(vide ? '·' : val)}</div>`;
}

function rowInner(p) {
  const masked = p.nameSource === 'hidden' || p.nameSource === 'unknown';
  const lock = p.lockState === 'locked' ? `<span class="lock locked" title="Agent verrouillé"></span>`
             : p.lockState === 'selected' ? `<span class="lock picking" title="En sélection"></span>` : '';
  const agent = p.agentIcon ? `<img src="${esc(p.agentIcon)}" alt="${esc(p.agent || '')}" loading="lazy">` : `<div class="ph">?</div>`;
  const party = p.partyColor ? `<span class="party" style="background:${esc(p.partyColor)}" title="${p.partyGuessed ? 'Duo probable' : 'Groupe confirmé'}"></span>` : '';
  const anon = p.incognito ? `<span class="mini" title="Pseudo masqué en jeu — révélé par le tracker">anon</span>` : '';

  const sub = [];
  if (p.agent) sub.push(esc(p.agent));
  if (p.level) sub.push('niv ' + p.level);
  else if (p.levelHidden) sub.push('niv masqué');
  if (p.peak && p.peak.name) sub.push('peak ' + esc(p.peak.name));

  const rr = [];
  if (p.leaderboard) rr.push(`<span class="lb">#${p.leaderboard}</span>`);
  if (p.rr != null) rr.push(p.rr + ' RR');
  if (p.rrChange) rr.push(`<span class="${p.rrChange > 0 ? 'up' : 'down'}">${p.rrChange > 0 ? '+' : ''}${p.rrChange}</span>`);

  const chips = [];
  if (p.lastSeen) chips.push(`<span class="chip" title="Déjà croisé ${esc(seenLong(p.lastSeen))}">déjà croisé · ${seenShort(p.lastSeen)}</span>`);
  if (S.showSmurf && p.smurf && p.smurf.flag && !p.me)
    chips.push(`<span class="chip smurf" title="${esc((p.smurf.reasons || []).join(', '))}">smurf probable</span>`);
  if (p.note) chips.push(`<span class="chip note" title="${esc(p.note)}">${esc(p.note)}</span>`);

  const kd  = p.kd  == null ? '·' : p.kd.toFixed(2);
  const acs = p.acs == null ? '·' : String(p.acs);
  const hs  = p.hs  == null ? '·' : p.hs + '%';
  const wr  = p.winrate == null ? '·' : p.winrate + '%';
  const extra = skinStrip(p) + (chips.length ? `<div class="chips">${chips.join('')}</div>` : '');

  return `
    <div class="pAgent">${agent}${lock}</div>
    <div class="pWho">
      <div class="pName">${flagImg(p.country)}${party}<span class="n ${masked ? 'masked' : ''}"${p.title ? ` title="« ${esc(p.title)} »"` : ''}>${esc(p.name)}</span><span class="tag">#${esc(p.tag)}</span>${anon}</div>
      ${sub.length ? `<div class="pSub">${sub.join('<span class="sep">·</span>')}</div>` : ''}
    </div>
    <div class="pRank">
      ${p.rank && p.rank.icon ? `<img src="${esc(p.rank.icon)}" alt="" loading="lazy">` : ''}
      <div style="min-width:0">
        <div class="rn">${esc((p.rank && p.rank.name) || '—')}</div>
        ${rr.length ? `<div class="rr">${rr.join(' ')}</div>` : ''}
      </div>
    </div>
    ${cell(kd, kdClass(p.kd), 'kd')}${cell(acs, acsClass(p.acs), 'acs')}${cell(hs, '', 'hs')}${cell(wr, '', 'wr')}
    <div class="pForm" title="Forme récente">${formBars(p.form)}</div>
    <div class="plStats">
      <span>KD <b class="${kdClass(p.kd)}">${esc(kd)}</b></span>
      <span>ACS <b class="${acsClass(p.acs)}">${esc(acs)}</b></span>
      <span>HS <b>${esc(hs)}</b></span>
      ${formHtml(p.form)}
    </div>
    ${extra ? `<div class="pExtra">${extra}</div>` : ''}`;
}

function sortPlayers(list) {
  const key = {
    rank:  p => -((p.rank && p.rank.tier) || 0),
    kd:    p => -(p.kd || 0),
    acs:   p => -(p.acs || 0),
    level: p => -(p.level || 0),
    name:  p => String(p.name).toLowerCase(),
  }[S.sort] || (p => -((p.rank && p.rank.tier) || 0));
  return [...list].sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0));
}

/* on ne réécrit QUE ce qui a bougé, et un chiffre qui change fait un petit
   flash ♡ le reste de l'écran ne bronche pas — pas de re-render global,
   sinon les images clignotent et la page saute à chaque rafraîchissement~ */
function syncList(box, players) {
  const keep = new Set();
  players.forEach((p, i) => {
    keep.add(p.puuid);
    let wrap = box.querySelector(`:scope > [data-puuid="${String(p.puuid).replace(/"/g, '')}"]`);
    const html = rowInner(p);
    const plCls = 'pl gridRow' + (p.me ? ' me' : '');
    if (!wrap) {
      wrap = document.createElement('div');
      wrap.className = 'plWrap' + (firstLoad ? '' : ' fresh');
      wrap.dataset.puuid = p.puuid;
      wrap.innerHTML = `<div class="${plCls}"></div><div class="plDetail"><div class="in"><div class="pad"></div></div></div>`;
      wrap.firstChild.innerHTML = html; wrap._h = html;
      box.appendChild(wrap);
      if (!firstLoad) setTimeout(() => wrap.classList.remove('fresh'), 400);
    } else {
      const pl = wrap.firstChild;
      if (wrap._h !== html) {
        const before = {};
        pl.querySelectorAll('[data-k]').forEach(c => { before[c.dataset.k] = c.textContent; });
        pl.innerHTML = html; wrap._h = html;
        pl.querySelectorAll('[data-k]').forEach(c => {
          const old = before[c.dataset.k];
          if (old != null && old !== c.textContent && old !== '·') c.classList.add('chg');
        });
      }
      if (pl.className !== plCls) pl.className = plCls;
    }
    wrap.dataset.name = p.name + '#' + p.tag;
    if (box.children[i] !== wrap) box.insertBefore(wrap, box.children[i] || null);
  });
  [...box.children].forEach(c => { if (!keep.has(c.dataset.puuid)) c.remove(); });
}

const colHead = () => `<div class="colHead gridRow">
  <span></span><span class="l">Joueur</span><span class="l">Rang</span>
  <span>KD</span><span>ACS</span><span>HS</span><span>WR</span><span>Forme</span></div>`;

function teamAvg(t) {
  if (!t) return '';
  const b = [];
  if (t.avgTierName && t.avgTierName.name) b.push(`<b>${esc(t.avgTierName.name)}</b>`);
  if (t.avgKd != null) b.push('KD <b>' + esc(t.avgKd) + '</b>');
  if (t.avgAcs != null) b.push('ACS <b>' + esc(t.avgAcs) + '</b>');
  if (t.avgLevel) b.push('niv <b>' + Math.round(t.avgLevel) + '</b>');
  return b.join('  ·  ');
}

function lobbyInfo(d) {
  const bits = [];
  if (d.partyState === 'MATCHMAKING' && d.queueEta) bits.push(`<span class="pill">File <b>~${mmss(d.queueEta)}</b></span>`);
  if (d.penalty) bits.push(`<span class="pill" style="color:var(--bad)">Pénalité ${mmss(d.penalty)}</span>`);
  if (d.inviteCode) bits.push(`<span class="pill">Code <b>${esc(d.inviteCode)}</b></span>`);
  (d.pings || []).forEach(p => {
    const col = p.ping <= 30 ? 'var(--good)' : p.ping <= 60 ? 'var(--warn)' : 'var(--bad)';
    bits.push(`<span class="pill">${esc(p.pod)} <b style="color:${col}">${p.ping} ms</b></span>`);
  });
  return bits.length ? `<div class="hd" style="margin-top:0"><span style="display:flex;gap:7px;flex-wrap:wrap">${bits.join('')}</span></div>` : '';
}

const prevVals = new Map();
let mergeKey = '';
function keepPrev(prev, next) {
  const out = Object.assign({}, next);
  for (const k in prev) {
    const nv = out[k], ov = prev[k];
    const vide  = nv == null || (Array.isArray(nv) && !nv.length);
    const plein = ov != null && !(Array.isArray(ov) && !ov.length);
    if (vide && plein) out[k] = ov;
  }
  return out;
}

function render(data) {
  if (!data || !data.state) return;
  if (!Array.isArray(data.players)) data.players = [];

  if (data.players.length) {
    const mk = `${data.state}|${data.map || ''}|${data.queue || ''}`;
    if (mk !== mergeKey) {
      prevVals.clear();
      for (const k in lockerCache) delete lockerCache[k];
      mergeKey = mk;
    }
    data.players = data.players.map(p => {
      const merged = prevVals.has(p.puuid) ? keepPrev(prevVals.get(p.puuid), p) : p;
      prevVals.set(p.puuid, merged);
      return merged;
    });
  }

  elCtx.textContent = [data.queue, data.map].filter(Boolean).join(' · ');
  elScore.hidden = !data.score;
  if (data.score) elScore.innerHTML = `${data.score.ally}<i>–</i>${data.score.enemy}`;
  elState.className = 'st';

  const plain = (label, html, key) => {
    elState.textContent = label;
    if (shellKey !== key) { live.innerHTML = html; shellKey = key; }
  };

  if (data.state === 'LOADING') {
    if (hasPlayers) return;
    return plain('Analyse…', `<div class="skel"></div><div class="skel"></div><div class="skel"></div>`, 'loading');
  }
  if (data.state === 'OFFLINE' || data.state === 'ERROR') {
    return plain('Hors ligne', `<div class="empty"><span class="big">⏻</span>${esc(data.error || 'Erreur')}</div>`, 'off:' + (data.error || ''));
  }
  if (data.state === 'MENUS') {
    const why = data.warning || data.error || '';
    return plain('Menus', `<div class="empty"><span class="big">◍</span>Dans les menus.<br>
      Le lobby s'affiche dès que le client Riot répond.
      ${why ? `<br><small style="color:var(--warn)">${esc(why)}</small>` : ''}
      <br><small>Toujours rien alors que tu es en lobby ? Clique sur la barre du bas, puis <b>F9</b>.</small></div>`, 'menus:' + why);
  }

  const T = data.teams || {};
  let secs;
  if (data.state === 'LOBBY') {
    elState.textContent = data.partyState === 'MATCHMAKING' ? 'En file' : 'Lobby';
    if (data.partyState === 'MATCHMAKING') elState.classList.add('live');
    secs = [['Ton lobby', 'neutral', 'lobby', data.players, null]];
  } else if (data.ffa) {
    elState.textContent = data.state === 'PREGAME' ? 'Sélection' : 'En game';
    elState.classList.add('live');
    secs = [['Joueurs', 'neutral', 'all', data.players, null]];
  } else {
    elState.textContent = data.state === 'PREGAME'
      ? 'Sélection' + (data.phase && data.phase.remaining ? ' ' + mmss(data.phase.remaining) : '') : 'En game';
    elState.classList.add('live');
    secs = [['Ton équipe', 'ally', 'ally', data.players.filter(p => p.team === 'ally'), T.ally],
            ['Équipe adverse', 'enemy', 'enemy', data.players.filter(p => p.team === 'enemy'), T.enemy]];
  }

  const key = 'live:' + secs.map(s => s[2]).join(',') + (S.dense ? ':d' : '') + (S.wideSkins ? ':w' : '');
  if (shellKey !== key) {
    live.innerHTML = `<div id="liveTop"></div><div class="teams ${secs.length > 1 ? 'two' : ''}">` +
      secs.map(([t, side, id]) =>
        `<section class="team${S.dense ? ' dense' : ''}${S.wideSkins ? ' wide' : ''}" data-side="${side}">
           <div class="teamHead"><h2>${t}</h2><span class="cnt" id="cnt-${id}"></span><span class="avg" id="avg-${id}"></span></div>
           ${colHead()}<div id="list-${id}"></div>
         </section>`).join('') + `</div>`;
    shellKey = key;
  }

  const top = (data.state === 'LOBBY' ? lobbyInfo(data) : '');
  const topEl = $('liveTop');
  if (topEl && topEl._h !== top) { topEl.innerHTML = top; topEl._h = top; }

  secs.forEach(([, , id, list, tm]) => {
    const c = $('cnt-' + id); if (c) c.textContent = list.length;
    const av = $('avg-' + id), html = teamAvg(tm);
    if (av && av._h !== html) { av.innerHTML = html; av._h = html; }
    const box = $('list-' + id);
    syncList(box, sortPlayers(list));
    fetchMissingSkins(box);
  });

  hasPlayers = data.players.length > 0;
  const ids = new Set(data.players.map(p => p.puuid));
  if (!firstLoad) {
    const nw = data.players.filter(p => !lastPuuids.has(p.puuid) && p.lastSeen);
    if (nw.length === 1) toast(`${nw[0].name} — déjà croisé ${nw[0].lastSeen.count || 1}×`);
    else if (nw.length > 1) toast(`${nw.length} joueurs déjà croisés dans cette game`);
  }
  lastPuuids = ids;
}

/* ╭──────────────────────────────────────────────────────────╮
   │  le temps réel ♡
   │  le serveur pousse, on écoute sagement
   ╰──────────────────────────────────────────────────────────╯ */
let es = null, polling = false, busyT;
function setConn(cls, txt) { elConn.className = 'conn ' + cls; elConn.title = txt; }
function busy(on) {
  clearTimeout(busyT);
  $('bar').classList.toggle('busy', !!on);
  if (on) busyT = setTimeout(() => $('bar').classList.remove('busy'), 4000);
}

function apply(d) {
  lastData = d;
  if (d.stale) setConn('poll', 'Le client Riot ne répond pas — reprise automatique');
  else if (d.state && d.state !== 'LOADING') setConn(es ? 'on' : 'poll', 'Temps réel actif');
  busy(!!d._building);
  if (d._version != null) {
    if (d._version === lastVersion && !firstLoad) return;
    lastVersion = d._version;
  }
  render(d);
  firstLoad = false;
}
function rerender() { shellKey = ''; if (lastData) render(lastData); }

function startStream() {
  stopPoll();
  if (!('EventSource' in window)) return startPoll();
  try { es = new EventSource('/api/stream'); } catch (e) { return startPoll(); }
  es.onopen = () => setConn('on', 'Temps réel actif');
  es.onmessage = ev => { try { apply(JSON.parse(ev.data)); setConn('on', 'Temps réel actif'); } catch (e) {} };
  es.onerror = () => {
    setConn('off', 'Reconnexion…');
    if (es && es.readyState === 2) {
      es = null; startPoll();
      setTimeout(() => { if (polling) { stopPoll(); startStream(); } }, 20000);
    }
  };
}
function startPoll() {
  if (polling) return;
  polling = true;
  setConn('poll', 'Mode compatibilité (interrogation)');
  (async () => {
    while (polling) {
      const t0 = Date.now();
      try {
        const d = await (await fetch('/api/game?since=' + lastVersion)).json();
        if (!polling) break;
        apply(d);
        setConn('poll', 'Mode compatibilité (interrogation)');
        const left = 900 - (Date.now() - t0);
        if (left > 0) await sleep(left);
      } catch (e) {
        setConn('off', 'Serveur injoignable');
        if (firstLoad) {
          elState.textContent = 'Serveur off';
          live.innerHTML = `<div class="empty"><span class="big">⌁</span>Impossible de joindre le serveur.<br>Vérifie que <b>server.py</b> tourne sur le PC.</div>`;
          shellKey = 'srvoff';
        }
        await sleep(2000);
      }
    }
  })();
}
function stopPoll() { polling = false; }

/* clic sur la barre du bas = grand rafraîchissement ♡ aucun voile, aucun
   spinner : juste le petit trait qui balaie le haut de la barre~ */
function doRefresh() {
  busy(true);
  if (view === 'live') {
    fetch('/api/game?hard=1').catch(() => {});
    if (!es && !polling) startStream();
  } else if (view === 'me') loadMe(true);
  else loadJournal(true);
}
$('barState').addEventListener('click', doRefresh);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  if (e.key === 'r' || e.key === 'R') doRefresh();
  if (e.key === 'Escape') document.querySelectorAll('.plWrap.open').forEach(w => w.classList.remove('open'));
});

async function fillDetail(wrap) {
  if (wrap._loaded) return;
  const pu = wrap.dataset.puuid, name = wrap.dataset.name || '';
  const pad = wrap.querySelector('.pad');
  pad.innerHTML = `<div style="color:var(--dim3);font-size:.78rem;padding:6px 0">Chargement…</div>`;
  let d = detailCache[pu], locker = null;
  try {
    const [det, lk] = await Promise.all([
      d ? Promise.resolve(d) : fetch('/api/player/' + encodeURIComponent(pu)).then(r => r.json()),
      fetch('/api/locker/' + encodeURIComponent(pu)).then(r => r.json()).catch(() => null),
    ]);
    d = det; detailCache[pu] = det; locker = lk;
  } catch (e) {
    pad.innerHTML = `<div style="color:var(--dim2);font-size:.78rem">Impossible de charger ce joueur.</div>`;
    return;
  }
  pad.innerHTML = detailHtml(d, locker);
  wrap._loaded = true;

  const note = pad.querySelector('[data-note]');
  pad.querySelector('[data-save]').onclick = async () => {
    await fetch('/api/note', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ puuid: pu, text: note.value }) });
    d.note = note.value;
    const s = pad.querySelector('[data-saved]');
    s.classList.add('on'); setTimeout(() => s.classList.remove('on'), 1500);
    fetch('/api/game?refresh=1').catch(() => {});
  };
  pad.querySelector('[data-copy]').onclick = () => {
    if (navigator.clipboard) navigator.clipboard.writeText(name).then(() => toast('Riot ID copié'), () => toast('Copie impossible'));
  };
  const sel = pad.querySelector('[data-flag]');
  try {
    if (!window._countries) window._countries = (await (await fetch('/api/countries')).json()).countries || [];
    const cur = (d.country && d.country.code) || '';
    sel.innerHTML = `<option value="">— Aucun drapeau —</option>` +
      window._countries.map(c => `<option value="${esc(c.code)}" ${c.code === cur ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
    sel.onchange = async () => {
      await fetch('/api/flag', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ puuid: pu, code: sel.value }) });
      delete detailCache[pu];
      toast(sel.value ? 'Drapeau enregistré' : 'Drapeau retiré');
      fetch('/api/game?refresh=1').catch(() => {});
    };
  } catch (e) { sel.innerHTML = `<option value="">Liste indisponible</option>`; }
}

document.addEventListener('click', e => {
  if (e.target.closest('a, button, select, input, textarea')) return;
  const row = e.target.closest('.row.click');
  if (row) return openFromJournal(row);
  const wrap = e.target.closest('.plWrap');
  if (!wrap || !wrap.querySelector('.pl')) return;
  const open = wrap.classList.toggle('open');
  if (open) fillDetail(wrap);
});

async function loadMe(force) {

let histLoaded = false;

function matchRow(m) {
  const cls = m.won === true ? 'win' : m.won === false ? 'loss' : 'draw';
  const rr = m.rr == null ? '' : `<span class="pill" style="color:${m.rr >= 0 ? 'var(--good)' : 'var(--bad)'}">${m.rr >= 0 ? '+' : ''}${m.rr} RR</span>`;
  return `<div class="row ${cls}">
    <img class="ic" src="${esc(m.agentIcon || m.mapIcon || '')}" alt="" loading="lazy">
    <div><div class="t1">${esc(m.map)} ${rr} ${m.tier ? `<span class="pill">${esc(m.tier.name)}</span>` : ''}</div>
    <div class="t2">${esc(m.agent || '')} · ${esc(m.queue)} · ${m.ts ? dt(m.ts) : ''} · ${num(m.roundsWon)}-${num(m.roundsLost)}</div></div>
    <div class="rt">${m.k}/${m.d}/${m.a}<small>${num(m.acs)} ACS · ${num(m.hs)}% HS</small></div>
  </div>`;
}

function shortTier(name) {
  const m = String(name || '').match(/^(\S+)\s*(\d+)?/);
  return m ? (m[1].length <= 2 ? m[1] : m[1].slice(0, 2)) + (m[2] || '') : '';
}

function sparkline(pts, tierNames) {
  if (!pts || pts.length < 2) return '';
  tierNames = tierNames || {};
  const W = 640, H = 168, PL = 46, PR = 14, PT = 16, PB = 26;
  const abs = p => (p.tier || 0) * 100 + (p.rr ?? 0);
  const A = pts.map(abs);
  let mn = Math.min(...A), mx = Math.max(...A);
  if (mn === mx) { mn -= 12; mx += 12; }
  const pad = Math.max(8, (mx - mn) * .15); mn -= pad; mx += pad;
  const X = i => PL + i * (W - PL - PR) / (pts.length - 1);
  const Y = v => PT + (mx - v) * (H - PT - PB) / (mx - mn);
  const nameOf = t => tierNames[t] || (pts.find(p => p.tier === t) || {}).tierName || '';

  let bands = '';
  for (let t = Math.floor(mn / 100); t <= Math.floor(mx / 100); t++) {
    const yTop = Y(Math.min(mx, (t + 1) * 100)), yBot = Y(Math.max(mn, t * 100));
    const hgt = Math.max(0, yBot - yTop), nm = shortTier(nameOf(t));
    if (hgt > 0) bands += `<rect x="${PL}" y="${yTop.toFixed(1)}" width="${W - PL - PR}" height="${hgt.toFixed(1)}" fill="#ffffff" opacity="${t % 2 ? .035 : .012}"/>`;
    if (hgt > 14 && nm) bands += `<text x="${(PL - 8).toFixed(1)}" y="${(yTop + hgt / 2 + 3.5).toFixed(1)}" text-anchor="end" fill="#62626a" font-size="10">${esc(nm)}</text>`;
    if (t * 100 > mn) bands += `<line x1="${PL}" y1="${yBot.toFixed(1)}" x2="${W - PR}" y2="${yBot.toFixed(1)}" stroke="#202023" stroke-width="1"/>`;
  }
  const P = pts.map((p, i) => [X(i), Y(abs(p))]);
  let d = `M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for (let i = 0; i < P.length - 1; i++) {
    const [x0, y0] = P[i], [x1, y1] = P[i + 1], cx = (x0 + x1) / 2;
    d += ` C${cx.toFixed(1)},${y0.toFixed(1)} ${cx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  }
  const area = `${d} L${P[P.length - 1][0].toFixed(1)},${H - PB} L${P[0][0].toFixed(1)},${H - PB} Z`;
  const dots = pts.map((p, i) => {
    const last = i === pts.length - 1;
    const col = (p.earned ?? 0) >= 0 ? '#7fbe9b' : '#d38b91';
    return `<circle cx="${X(i).toFixed(1)}" cy="${Y(abs(p)).toFixed(1)}" r="${last ? 4 : 2.4}" fill="${last ? col : '#101011'}" stroke="${col}" stroke-width="${last ? 2 : 1.6}">
      <title>${esc(p.tierName)} · ${p.rr} RR (${(p.earned ?? 0) >= 0 ? '+' : ''}${p.earned})${p.ts ? ' · ' + dt(p.ts) : ''}</title></circle>`;
  }).join('');
  const lp = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="gRR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".16"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient></defs>${bands}
    <path d="${area}" fill="url(#gRR)"/>
    <path d="${d}" fill="none" stroke="#ececee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <text x="${W - PR}" y="${H - 7}" text-anchor="end" fill="#96969c" font-size="10">${esc(lp.tierName)} · ${lp.rr} RR</text>
    <text x="${PL}" y="${H - 7}" fill="#62626a" font-size="10">${pts.length} dernières games classées</text></svg>`;
}

async function loadHistory(force) {
  if (histLoaded && !force) return;
  $('meStats').innerHTML = `<div class="skel"></div><div class="skel"></div>`;
  try {
    const d = await (await fetch('/api/history?n=20')).json();
    if (d.error) throw new Error(d.error);
    const g = d.rrGraph || [];
    const total = g.reduce((s, p) => s + (p.earned || 0), 0);
    const midnight = new Date(); midnight.setHours(0, 0, 0, 0);
    const day = g.filter(p => p.ts && p.ts >= midnight.getTime());
    const today = day.reduce((s, p) => s + (p.earned || 0), 0);
    let h = '';
    if (g.length > 1) {
      h += `<div class="hd">Courbe RR<span class="right">${day.length ? `aujourd'hui <b style="color:${today >= 0 ? 'var(--good)' : 'var(--bad)'}">${today >= 0 ? '+' : ''}${today}</b> · ` : ''}total <b>${total >= 0 ? '+' : ''}${total}</b> / ${g.length} games</span></div>
        <div class="panel" style="padding:10px">${sparkline(g, d.tierNames)}</div>`;
    }
    const ms = d.matches || [];
    h += `<div class="hd">Tes derniers matchs <span class="cnt">${ms.length}</span></div>`;
    h += ms.length ? `<div class="panel">${ms.map(matchRow).join('')}</div>` : `<div class="empty">Aucun match trouvé.</div>`;
    $('meStats').innerHTML = h;
    histLoaded = true;
  } catch (e) {
    $('meStats').innerHTML = `<div class="empty"><span class="big">↯</span>Historique indisponible.<br><small>${esc(e.message)}</small></div>`;
  }
}

let storeLoaded = false;
function shopCell(it) {
  const price = it.discount ? `<span class="c"><s>${it.base}</s> ${it.cost} VP</span>` : `<span class="c">${num(it.cost)} VP</span>`;
  return `<div class="shopCell" style="border-top-color:${esc(it.tierColor || 'var(--line2)')}">
    ${it.icon ? `<img src="${esc(it.icon)}" alt="" loading="lazy">` : '<div style="height:42px"></div>'}
    <span class="n">${esc(it.name)}</span>${price}
    ${it.discount ? `<span class="pill" style="color:var(--good)">-${it.discount}%</span>` : ''}</div>`;
}

async function loadStore(force) {
  if (storeLoaded && !force) return;
  $('meStore').innerHTML = `<div class="skel"></div>`;
  try {
    const d = await (await fetch('/api/store')).json();
    if (d.error) throw new Error(d.error);
    let h = `<div class="hd">Boutique</div><div class="walletRow">` +
      Object.entries(d.wallet || {}).map(([k, v]) => `<div class="w">${v}<small>${esc(k)}</small></div>`).join('') + `</div>`;
    if (d.daily && d.daily.length)
      h += `<div class="hd">Boutique du jour <span class="cnt">${dur(d.dailyRemaining)}</span></div><div class="grid2">${d.daily.map(shopCell).join('')}</div>`;
    if (d.night && d.night.length)
      h += `<div class="hd">Marché nocturne <span class="cnt">${dur(d.nightRemaining)}</span></div><div class="grid2">${d.night.map(shopCell).join('')}</div>`;
    if (d.bundles && d.bundles.length)
      h += `<div class="hd">Bundle</div><div class="panel">` + d.bundles.map(b => `<div class="row noic">
        <div><div class="t1">${esc(b.name)}</div><div class="t2">${b.items} objets${b.remaining ? ' · ' + Math.round(b.remaining / 86400) + ' j restants' : ''}</div></div>
        <div class="rt">${num(b.cost)} VP<small>${b.discount ? '-' + b.discount + '%' : ''}</small></div></div>`).join('') + `</div>`;
    if (d.accessory && d.accessory.length)
      h += `<div class="hd">Accessoires</div><div class="grid2">` + d.accessory.map(a => `<div class="shopCell">
        ${a.icon ? `<img src="${esc(a.icon)}" alt="" loading="lazy">` : '<div style="height:42px"></div>'}
        <span class="n">${esc(a.name)}</span><span class="c">${num(a.cost)} KC</span></div>`).join('') + `</div>`;
    $('meStore').innerHTML = h;
    storeLoaded = true;
  } catch (e) {
    $('meStore').innerHTML = `<div class="hd">Boutique</div><div class="empty"><span class="big">◇</span>Boutique indisponible.<br><small>${esc(e.message)}</small></div>`;
  }
}

function renderSettings() {
  $('meSet').innerHTML = `
    <div class="hd">Réglages</div>
    <div class="panel">
      <div class="setRow"><div>Mise à jour<small id="connTxt">…</small></div><span class="pill" id="connPill">—</span></div>
      <div class="setRow"><div>Tri des joueurs<small>Dans chaque équipe</small></div>
        <select class="sel" id="setSort">${[['rank','Rang'],['kd','KD'],['acs','ACS'],['level','Niveau'],['name','Nom']]
          .map(([v, l]) => `<option value="${v}" ${S.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="setRow"><div>Taille de l'affichage<small>« Auto » s'adapte à la largeur de l'écran</small></div>
        <select class="sel" id="setScale">${[['','Auto'],['xs','Très compact'],['s','Compact'],['m','Normal'],['l','Grand']]
          .map(([v, l]) => `<option value="${v}" ${S.scale === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="setRow"><div>Nom des skins en clair<small>Sinon seule l'image s'affiche (survol ou dépli = nom)</small></div>
        <div class="sw ${S.wideSkins ? 'on' : ''}" id="setWide"></div></div>
      <div class="setRow"><div>Affichage dense<small>Lignes serrées, sans skins ni étiquettes</small></div>
        <div class="sw ${S.dense ? 'on' : ''}" id="setDense"></div></div>
      <div class="setRow"><div>Détecteur de smurf<small>Étiquette quand les indices s'accumulent</small></div>
        <div class="sw ${S.showSmurf ? 'on' : ''}" id="setSmurf"></div></div>
      <div class="setRow"><div>Compte<small id="aboutTxt">…</small></div><span></span></div>
      <div class="setRow"><div>Raccourcis<small>Page : R rafraîchir · Échap tout replier · clic sur une ligne déplie le joueur.
        Windows : F6 fond · F7 ouvrir · F8 quitter · F9 redémarrer</small></div><span></span></div>
    </div>`;
  const live_ = es && es.readyState !== 2;
  $('connPill').textContent = live_ ? 'Temps réel' : polling ? 'Interrogation' : 'Hors ligne';
  $('connPill').style.color = live_ ? 'var(--good)' : polling ? 'var(--warn)' : 'var(--bad)';
  $('connTxt').textContent = live_ ? 'Le serveur pousse les changements instantanément'
                                   : 'Repli automatique — le temps réel se rétablit tout seul';
  $('setSort').onchange = e => { S.sort = e.target.value; saveS(); rerender(); };
  $('setScale').onchange = e => { S.scale = e.target.value; saveS(); applyScale(); };
  const tog = (id, key) => { $(id).onclick = e => { S[key] = !S[key]; saveS(); e.target.classList.toggle('on', S[key]); rerender(); }; };
  tog('setDense', 'dense'); tog('setSmurf', 'showSmurf'); tog('setWide', 'wideSkins');
  fetch('/api/me').then(r => r.json()).then(m => {
    const el = $('aboutTxt');
    if (el) el.textContent = `${m.name || '?'}#${m.tag || ''} · ${(m.region || '').toUpperCase()} · ${m.season || ''} · client ${m.version || ''}`;
  }).catch(() => {});
}

/* ╭──────────────────────────────────────────────────────────╮
   │  le journal ♡
   │  tous ceux que tu as déjà croisés
   ╰──────────────────────────────────────────────────────────╯ */
let journalLoaded = false;
function journalShell() {
  $('journal').innerHTML = `<div class="searchBar"><input id="jq" placeholder="Chercher un joueur…" autocomplete="off"></div><div id="jlist"><div class="skel"></div></div>`;
  const inp = $('jq');
  inp.addEventListener('input', () => { clearTimeout(inp._t); inp._t = setTimeout(fetchJournal, 250); });
}

async function fetchJournal() {
  const search = $('jq') ? $('jq').value : '';
  try {
    const d = await (await fetch('/api/journal?q=' + encodeURIComponent(search))).json();
    const rows = d.rows || [];
    $('jlist').innerHTML = `<div class="hd">Joueurs croisés <span class="cnt">${rows.length}</span></div>` +
      (rows.length ? `<div class="panel">` + rows.map(r => `
        <div class="row noic click" data-puuid="${esc(r.puuid)}" data-name="${esc(r.name)}">
          <div><div class="t1">${esc(r.name)} ${r.rank ? `<span class="pill">${esc(r.rank)}</span>` : ''}</div>
          <div class="t2">${r.last && r.last.ts ? new Date(r.last.ts * 1000).toLocaleDateString('fr-FR') : ''} · ${esc((r.last && r.last.map) || '?')} · ${esc((r.last && r.last.queue) || '?')}${r.agents && r.agents.length ? ' · ' + esc(r.agents.slice(0, 4).join(', ')) : ''}</div></div>
          <div class="rt">${r.count}×<small>${r.asAlly} avec / ${r.asEnemy} contre</small></div></div>`).join('') + `</div>`
      : `<div class="empty">Aucun joueur enregistré pour l'instant.</div>`);
  } catch (e) { $('jlist').innerHTML = `<div class="empty">Journal indisponible.</div>`; }
}

async function loadJournal(force) {
  if (journalLoaded && !force) return;
  journalShell(); await fetchJournal(); journalLoaded = true; busy(false);
}

/* dans le journal aussi, le détail s'ouvre juste sous la ligne ♡ */
function openFromJournal(row) {
  let wrap = row._wrap;
  if (wrap && wrap.parentNode) {
    const open = wrap.classList.toggle('open');
    if (open) fillDetail(wrap);
    return;
  }
  wrap = document.createElement('div');
  wrap.className = 'plWrap open';
  wrap.dataset.puuid = row.dataset.puuid;
  wrap.dataset.name = row.dataset.name || '';
  wrap.innerHTML = `<div class="plDetail"><div class="in"><div class="pad"></div></div></div>`;
  row.after(wrap);
  row._wrap = wrap;
  fillDetail(wrap);
}

/* ╭──────────────────────────────────────────────────────────╮
   │  on démarre ♡
   │  allez, c'est parti (๑˃ᴗ˂)ﻭ
   ╰──────────────────────────────────────────────────────────╯ */
startStream();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (!es && !polling) startStream();
  if (view === 'live') fetch('/api/game?refresh=1').catch(() => {});
});
window.addEventListener('online', () => { if (!es && !polling) startStream(); });
window.addEventListener('pagehide', () => { stopPoll(); if (es) { es.close(); es = null; } });
</script>
